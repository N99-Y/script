        els.addScriptForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isAdmin || !dbInitialized) {
                showToast(dbInitialized ? 'กรุณาเข้าสู่ระบบก่อน' : 'ระบบออฟไลน์ ไม่สามารถเพิ่มได้', 'error');
                return;
            }

            const title = document.getElementById('form-title').value.trim();
            const imageFile = document.getElementById('form-image').files[0];
            const content = document.getElementById('form-content').value.trim();
            const btn = document.getElementById('submit-script-btn');

            if (!title || !imageFile || !content) {
                showToast('กรุณากรอกข้อมูลและแนบรูปให้ครบถ้วน', 'error');
                return;
            }

            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<svg class="animate-spin h-5 w-5 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            btn.disabled = true;

            try {
                // 1. อัปโหลดรูปไปที่ Firebase Storage
                const storageRef = ref(storage, `script_images/${Date.now()}_${imageFile.name}`);
                const snapshot = await uploadBytes(storageRef, imageFile);
                const imageUrl = await getDownloadURL(snapshot.ref);

                // 2. บันทึกข้อมูลลง Firestore (รวมลิงก์รูปที่อัปโหลดเสร็จแล้ว)
                await addDoc(scriptsCollection, {
                    title,
                    imageUrl,
                    content,
                    views: 0,
                    createdAt: Date.now()
                });
                
                showToast('เพิ่มสคริปต์เรียบร้อยแล้ว!', 'success');
                els.addScriptForm.reset();
                switchView('home');
            } catch (error) {
                console.error("Error adding doc:", error);
                showToast('อัปโหลดรูปไม่สำเร็จ (กรุณาเช็ค Storage Rules)', 'error');
            } finally {
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            }
        });
